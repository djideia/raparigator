services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sigillus
      POSTGRES_PASSWORD: sigillus
      POSTGRES_DB: sigillus
    ports:
      - "${SIGILLUS_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigillus -d sigillus"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sigillus
      MINIO_ROOT_PASSWORD: sigillus-dev-secret
    ports:
      - "${SIGILLUS_MINIO_PORT:-9000}:9000"
      - "${SIGILLUS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sigillus sigillus-dev-secret &&
      mc mb --ignore-existing local/sigillus-media &&
      mc anonymous set download local/sigillus-media/public &&
      exit 0
      "

volumes:
  postgres-data:
  minio-data:
